
name: Astro Aacharya CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-aacharya-production
  cancel-in-progress: false

jobs:
  ci:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: backend
        run: npm install --no-package-lock

      - name: Check JavaScript Syntax
        run: |
          find backend -type f -name '*.js' \
            -not -path '*/node_modules/*' \
            -print0 | xargs -0 -r -n 1 node --check

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SSH Secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"

          if ! [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "Invalid VPS_HOST secret"
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test VPS Connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "echo SSH connection successful"

      - name: Create Deployment Backup and Directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            mkdir -p /www/wwwroot/AstroBackend/backend
          '

      - name: Sync Backend Files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='uploads/' \
            --exclude='node_modules/' \
            --exclude='.well-known/' \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            backend/ \
            "$VPS_USER@$VPS_HOST:/www/wwwroot/AstroBackend/backend/"

      - name: Install Production Dependencies
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            cd /www/wwwroot/AstroBackend/backend &&
            npm install --omit=dev --no-package-lock &&
            chown -R www:www .
          '

      - name: Restart Astro Aacharya Backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -e

            APP_DIR="/www/wwwroot/AstroBackend/backend"

            cd "$APP_DIR"

            # Find only the Node process belonging to this directory.
            for proc in /proc/[0-9]*; do
              pid="${proc##*/}"

              [ -r "$proc/cmdline" ] || continue
              [ -r "$proc/cwd" ] || continue

              cwd=$(readlink -f "$proc/cwd" 2>/dev/null || true)
              cmd=$(tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true)

              if [ "$cwd" = "$APP_DIR" ] &&
                 [ "$cmd" = "node server.js " ]; then
                echo "Stopping existing Astro backend PID: $pid"
                kill -TERM "$pid"
              fi
            done

            sleep 3

            # Start backend as the existing www user.
            runuser -u www -- bash -c \
              "cd '$APP_DIR' && nohup node server.js >> '$APP_DIR/deploy.log' 2>&1 < /dev/null &"

            sleep 3

            echo "========== BACKEND PROCESS =========="
            pgrep -af "node server.js" || true

            echo "========== DEPLOYMENT COMPLETE =========="
          REMOTE
